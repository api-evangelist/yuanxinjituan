name: yuanxinjituan
description: >-
  Yuanxinjituan (Beijing Yuanxin Technology Group Co., Ltd. / 圆心科技集团) is a Chinese healthcare-technology
  company founded in 2015 and headquartered in Beijing, dedicated to delivering value across the full
  patient care cycle. It operates an integrated online-and-offline platform spanning three core scenarios
  — medical consultation, medication, and payment — connecting doctors, patients, pharmaceutical companies,
  and insurers. Its businesses include the Miaoshou (妙手) internet hospital, hospital-side and DTP pharmacies
  (圆心药房), a prescription-sharing platform, pharmaceutical distribution, and the Yuanxin health-insurance
  arm (圆心惠保). Backed by Tencent, Sequoia China, and Qiming Venture Partners, Yuanxin is one of China's
  largest full-chain service providers for the commercialization of innovative drugs and has pursued a
  Hong Kong Stock Exchange main-board listing. The company presents a consumer/enterprise healthcare surface;
  no public developer API, open platform, or documentation was found during enrichment.
